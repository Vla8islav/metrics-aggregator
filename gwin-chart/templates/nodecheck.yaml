{{- if .Values.nodecheck.enabled }}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.nodecheck.names.daemonset }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.nodecheck.labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.nodecheck.labels | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.nodecheck.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- toYaml .Values.nodecheck.labels | nindent 8 }}
    spec:
      {{- if .Values.nodecheck.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodecheck.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.nodecheck.tolerations }}
      tolerations:
        {{- toYaml .Values.nodecheck.tolerations | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        {{- include "gwin.nodecheck.image.pullSecrets" . | nindent 8 }}
      serviceAccountName: {{ .Values.nodecheck.names.serviceAccount }}
      securityContext:
        {{- include "gwin.nodecheck.podSecurityContext" . | nindent 8 }}
      containers:
      - name: {{ .Values.nodecheck.names.daemonset }}
        image: "{{ .Values.nodecheck.image.name }}:{{ .Values.nodecheck.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ include "gwin.nodecheck.image.pullPolicy" . }}
        securityContext:
          {{- include "gwin.nodecheck.containerSecurityContext" . | nindent 10 }}
        ports:
        - containerPort: {{ .Values.nodecheck.service.port }}
          name: http
        env:
        - name: PORT
          value: "{{ .Values.nodecheck.service.port }}"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: {{ .Values.nodecheck.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.nodecheck.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.nodecheck.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.nodecheck.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: {{ .Values.nodecheck.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.nodecheck.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.nodecheck.probes.readiness.timeoutSeconds }}
          failureThreshold: {{ .Values.nodecheck.probes.readiness.failureThreshold }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nodecheck.names.service }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.nodecheck.labels | nindent 4 }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ipFamilyPolicy: {{ .Values.nodecheck.service.ipFamilyPolicy }}
  selector:
    {{- toYaml .Values.nodecheck.labels | nindent 4 }}
  ports:
  - port: {{ .Values.nodecheck.service.port }}
    targetPort: {{ .Values.nodecheck.service.port }}
    nodePort: {{ .Values.nodecheck.service.nodePort }}
    protocol: TCP
    name: http

# RBAC
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.nodecheck.names.serviceAccount }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.nodecheck.names.clusterRole }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.nodecheck.names.clusterRoleBinding }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.nodecheck.names.clusterRole }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.nodecheck.names.serviceAccount }}
  namespace: {{ .Release.Namespace }}

{{- end }}
