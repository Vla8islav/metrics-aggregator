                                  activated and traffic is routed only to healthy
                                  backends at all times."
                                format: int64
                                type: integer
                              strictLocality:
                                description: "Specifies whether a load balancer node
                                  should only send traffic to backends in its availability
                                  zone, regardless of their health, and ignore backends
                                  in other zones. \n If set to `true` and there are
                                  no healthy backends in the zone, the node in this
                                  zone will respond to incoming traffic with errors.
                                  For details about strict locality, see [documentation](/docs/application-load-balancer/concepts/backend-group#locality).
