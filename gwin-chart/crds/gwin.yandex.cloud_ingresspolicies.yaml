                    description: Specifies whether application load balancer is available
                      to zonal shift.
                    type: boolean
                  autoScale:
                    description: "Scaling settings of the application load balancer.
                      \n The scaling settings relate to a special internal instance
                      group which facilitates the balancer's work. Instances in this
                      group are called _resource units_. The group is scaled automatically
                      based on incoming load and within limitations specified in these
                      settings. \n For details about the concept, see [documentation](/docs/application-load-balancer/concepts/application-load-balancer#lcu-scaling)."
