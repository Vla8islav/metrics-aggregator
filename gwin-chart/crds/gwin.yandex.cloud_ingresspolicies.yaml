                            description: Load balancing configuration for the backend.
                            properties:
                              localityAwareRouting:
                                description: "Percentage of traffic that a load balancer
                                  node sends to healthy backends in its availability
                                  zone. The rest is divided equally between other
                                  zones. For details about zone-aware routing, see
                                  [documentation](/docs/application-load-balancer/concepts/backend-group#locality).
                                  \n If there are no healthy backends in an availability
                                  zone, all the traffic is divided between other zones.
                                  \n If `strictLocality` is `true`, the specified
                                  value is ignored. A load balancer node sends all
                                  the traffic within its availability zone, regardless
                                  of backends' health."
                                format: int64
                                type: integer
                              mode:
                                description: "Load balancing mode for the backend.
                                  \n For details about load balancing modes, see [documentation](/docs/application-load-balancer/concepts/backend-group#balancing-mode)."
                                type: string
                              panicThreshold:
                                description: "Threshold for panic mode. \n If percentage
                                  of healthy backends in the group drops below threshold,
                                  panic mode will be activated and traffic will be
                                  routed to all backends, regardless of their health
                                  check status. This helps to avoid overloading healthy
                                  backends. For details about panic mode, see [documentation](/docs/application-load-balancer/concepts/backend-group#panic-mode).
