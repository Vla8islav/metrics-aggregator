            description: "The policy is restricted to resources within the same namespace.
              \n When determining which resources the policy applies to, the following
              rules are used: - If both TargetRefs and Selector are specified, a resource
              must match both criteria to be affected by the policy. - If neither
              TargetRefs nor Selector is specified, the policy applies to all resources
              within the same namespace."
