                      idleTimeout:
                        description: "Idle timeout for an HTTP connection between
                          a load balancer node an a backend from the backend group:
                          the maximum time the connection is allowed to be idle, i.e.
                          without any data transferred over it. \n Specifying meaningful
                          values for both [timeout] and `idle_timeout` is useful for
                          implementing server-push mechanisms such as long polling,
                          server-sent events (`EventSource` interface) etc. \n If
                          a connection times out, the load balancer responds to the
                          client with a `504 Gateway Timeout` status code (HTTP) or
                          `UNAVAILABLE` status code (gRPC). \n If not specified, no
                          idle timeout is used, and an alive connection may be idle
                          for any duration (see [timeout])."
                        format: duration
