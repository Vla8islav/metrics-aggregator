                          units across all availability zones. \n If a positive value
                          is specified, it must be at least [min_zone_size] multiplied
                          by the size of [AllocationPolicy.locations]. \n If the value
                          is 0, there is no upper limit."
                        format: int64
                        type: integer
                      minZoneSize:
                        description: "Lower limit for the number of resource units
                          in each availability zone. \n If not specified previously
                          (using other instruments such as management console), the
                          default value is 2. To revert to it, specify it explicitly.
                          \n The minimum value is 2."
                        format: int64
                        type: integer
