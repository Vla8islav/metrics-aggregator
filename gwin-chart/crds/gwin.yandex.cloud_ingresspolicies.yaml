                            description: "Replacement for portions of the path that
                              match the pattern should be rewritten, even allowing
                              the substitution of capture groups from the pattern
                              into the new path as specified by the rewrite substitution
                              string. \n Only one of regex_rewrite, or prefix_rewrite
                              may be specified. \n Examples of using: - The path pattern
                              ^/service/([^/]+)(/.*)$ paired with a substitution string
                              of \\2/instance/\\1 would transform /service/foo/v1/api
                              into /v1/api/instance/foo. - The pattern one paired
                              with a substitution string of two would transform /xxx/one/yyy/one/zzz
                              into /xxx/two/yyy/two/zzz. - The pattern ^(.*?)one(.*)$
                              paired with a substitution string of \\1two\\2 would
                              replace only the first occurrence of one, transforming
                              path /xxx/one/yyy/one/zzz into /xxx/two/yyy/one/zzz.
                              - The pattern (?i)/xxx/ paired with a substitution string
                              of /yyy/ would do a case-insensitive match and transform
                              path /aaa/XxX/bbb to /aaa/yyy/bbb."
                            properties:
