                                    items:
                                      format: int64
                                      type: integer
                                    type: array
                                  host:
                                    description: Value for the HTTP/1.1 `Host` header
                                      or the HTTP/2 `:authority` pseudo-header used
                                      in requests to targets.
                                    type: string
                                  path:
                                    description: 'HTTP path used in requests to targets:
                                      request URI for HTTP/1.1 request line or value
                                      for the HTTP/2 `:path` pseudo-header.'
                                    type: string
                                  useHTTP2:
                                    description: "Enables HTTP/2 usage in health checks.
                                      \n Default value: `false`, HTTP/1.1 is used."
                                    type: boolean
                                type: object
