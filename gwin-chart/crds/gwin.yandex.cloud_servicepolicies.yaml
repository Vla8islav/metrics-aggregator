---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  name: servicepolicies.gwin.yandex.cloud
spec:
  group: gwin.yandex.cloud
  names:
    kind: ServicePolicy
    listKind: ServicePolicyList
    plural: servicepolicies
    singular: servicepolicy
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: "The policy is restricted to resources within the same namespace.
              \n When determining which resources the policy applies to, the following
              rules are used: - If both TargetRefs and Selector are specified, a resource
              must match both criteria to be affected by the policy. - If neither
              TargetRefs nor Selector is specified, the policy applies to all resources
              within the same namespace."
            properties:
              policy:
                description: Cloud specific configuration.
                properties:
                  targets:
                    description: Targets configures how ALB should select and address
                      Service endpoints. This determines which nodes or pods will
                      be used as ALB targets and how they are addressed.
                    properties:
                      albZoneMatch:
                        description: ALBZoneMatch controls whether to verify that
                          targets are located in the same zones as the ALB. When true
                          (default), only targets in ALB zones are included. When
                          false, targets from any zone can be used.
                        type: boolean
                      cidrs:
                        description: CIDRs helps select appropriate target addresses
                          when targets have multiple IP addresses. Only addresses
                          within these CIDR blocks will be used for ALB targets. Can
                          be specified as comma-separated list or JSON array.
                        items:
                          type: string
                        type: array
                      ipFamily:
                        description: 'IPFamily specifies which IP family to use for
                          target addresses. - IPv4: Use IPv4 addresses (default) -
                          IPv6: Use IPv6 addresses'
                        enum:
                        - IPv4
                        - IPv6
                        type: string
                      node:
                        description: Node contains additional configuration when Type
                          is "Node". This field is ignored when Type is "Pod".
                        properties:
                          addressType:
                            description: 'AddressType specifies which node address
                              type to use for ALB targets. - InternalIP: Use node''s
                              internal IP address (default) - ExternalIP: Use node''s
                              external IP address'
                            type: string
                          onlyWithPods:
                            description: OnlyWithPods controls whether to include
                              only nodes that have pods for this service. When true
                              (default), only nodes running pods that match the service
                              selector are used as targets. When false, all cluster
                              nodes are potential targets regardless of pod placement.
                            type: boolean
                        type: object
                      type:
                        description: 'Type specifies whether to use Node or Pod endpoints
                          as ALB targets. - Node: Use cluster nodes as targets (default)
                          - Pod: Use individual pods as targets'
                        enum:
                        - Node
                        - Pod
                        type: string
                    type: object
                type: object
              selector:
                description: A label selector is a label query over a set of resources.
                  The result of matchLabels and matchExpressions are ANDed. An empty
                  label selector matches all objects. A null label selector matches
                  no objects.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: A label selector requirement is a selector that
                        contains values, a key, and an operator that relates the key
                        and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: operator represents a key's relationship to
                            a set of values. Valid operators are In, NotIn, Exists
                            and DoesNotExist.
                          type: string
                        values:
                          description: values is an array of string values. If the
                            operator is In or NotIn, the values array must be non-empty.
                            If the operator is Exists or DoesNotExist, the values
                            array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: matchLabels is a map of {key,value} pairs. A single
                      {key,value} in the matchLabels map is equivalent to an element
                      of matchExpressions, whose key field is "key", the operator
                      is "In", and the values array contains only "value". The requirements
                      are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              targetRefs:
                items:
                  description: "LocalObjectReference identifies an API object within
                    the namespace of the referrer. The API object must be valid in
                    the cluster; the Group and Kind must be registered in the cluster
                    for this reference to be valid. \n References to objects with
                    invalid Group and Kind are not valid, and must be rejected by
                    the implementation, with appropriate Conditions set on the containing
                    object."
                  properties:
                    group:
                      description: Group is the group of the referent. For example,
                        "gateway.networking.k8s.io". When unspecified or empty string,
                        core API group is inferred.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      description: Kind is kind of the referent. For example "HTTPRoute"
                        or "Service".
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: Name is the name of the referent.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  type: object
                type: array
            required:
            - policy
            type: object
          status:
            properties:
              attachedServices:
                description: Number of currently attached services.
                format: int32
                type: integer
              conditions:
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource. --- This struct is intended for direct
                    use as an array at the field path .status.conditions.  For example,
                    \n type FooStatus struct{ // Represents the observations of a
                    foo's current state. // Known .status.conditions.type are: \"Available\",
                    \"Progressing\", and \"Degraded\" // +patchMergeKey=type // +patchStrategy=merge
                    // +listType=map // +listMapKey=type Conditions []metav1.Condition
                    `json:\"conditions,omitempty\" patchStrategy:\"merge\" patchMergeKey:\"type\"
                    protobuf:\"bytes,1,rep,name=conditions\"` \n // other fields }"
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another. This should be when
                        the underlying condition changed.  If that is not known, then
                        using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition. This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon. For instance, if .metadata.generation
                        is currently 12, but the .status.conditions[x].observedGeneration
                        is 9, the condition is out of date with respect to the current
                        state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition. Producers
                        of specific condition types may define expected values and
                        meanings for this field, and whether the values are considered
                        a guaranteed API. The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        --- Many .condition.type values are consistent across resources
                        like Available, but because arbitrary conditions can be useful
                        (see .node.status.conditions), the ability to deconflict is
                        important. The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
