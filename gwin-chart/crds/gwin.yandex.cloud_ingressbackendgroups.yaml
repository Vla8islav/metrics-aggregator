---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  name: ingressbackendgroups.gwin.yandex.cloud
spec:
  group: gwin.yandex.cloud
  names:
    kind: IngressBackendGroup
    listKind: IngressBackendGroupList
    plural: ingressbackendgroups
    singular: ingressbackendgroup
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: IngressBackendGroup defines a backend group for Ingress load
          balancing.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: IngressBackendGroupSpec defines the desired state of IngressBackendGroup.
            properties:
              backends:
                description: List of backends that the backend group consists of.
                items:
                  description: IngressBackend defines a backend configuration for
                    load balancing.
                  properties:
                    backendRef:
                      description: Reference to the backend.
                      properties:
                        group:
                          default: ""
                          description: Group is the group of the referent. For example,
                            "gateway.networking.k8s.io". When unspecified or empty
                            string, core API group is inferred.
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          default: Service
                          description: "Kind is the Kubernetes resource kind of the
                            referent. For example \"Service\". \n Defaults to \"Service\"
                            when not specified. \n ExternalName services can refer
                            to CNAME DNS records that may live outside of the cluster
                            and as such are difficult to reason about in terms of
                            conformance. They also may not be safe to forward to (see
                            CVE-2021-25740 for more information). Implementations
                            SHOULD NOT support ExternalName Services. \n Support:
                            Core (Services with a type other than ExternalName) \n
                            Support: Implementation-specific (Services with type ExternalName)"
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        name:
                          description: Name is the name of the referent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: "Namespace is the namespace of the backend.
                            When unspecified, the local namespace is inferred. \n
                            Note that when a namespace different than the local namespace
                            is specified, a ReferenceGrant object is required in the
                            referent namespace to allow that namespace's owner to
                            accept the reference. See the ReferenceGrant documentation
                            for details. \n Support: Core"
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        port:
                          description: Port specifies the destination port number
                            to use for this resource. Port is required when the referent
                            is a Kubernetes Service. In this case, the port number
                            is the service port number, not the target port. For other
                            resources, destination port might be derived from the
                            referent resource or this field.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: Must have port for Service reference
                        rule: '(size(self.group) == 0 && self.kind == ''Service'')
                          ? has(self.port) : true'
                    balancing:
                      description: Load balancing configuration for the backend.
                      properties:
                        localityAwareRouting:
                          description: "Percentage of traffic that a load balancer
                            node sends to healthy backends in its availability zone.
                            The rest is divided equally between other zones. For details
                            about zone-aware routing, see [documentation](/docs/application-load-balancer/concepts/backend-group#locality).
                            \n If there are no healthy backends in an availability
                            zone, all the traffic is divided between other zones.
                            \n If `strictLocality` is `true`, the specified value
                            is ignored. A load balancer node sends all the traffic
                            within its availability zone, regardless of backends'
                            health."
                          format: int64
                          type: integer
                        mode:
                          description: "Load balancing mode for the backend. \n For
                            details about load balancing modes, see [documentation](/docs/application-load-balancer/concepts/backend-group#balancing-mode)."
                          type: string
                        panicThreshold:
                          description: "Threshold for panic mode. \n If percentage
                            of healthy backends in the group drops below threshold,
                            panic mode will be activated and traffic will be routed
                            to all backends, regardless of their health check status.
                            This helps to avoid overloading healthy backends. For
                            details about panic mode, see [documentation](/docs/application-load-balancer/concepts/backend-group#panic-mode).
                            \n If the value is `0`, panic mode will never be activated
                            and traffic is routed only to healthy backends at all
                            times."
                          format: int64
                          type: integer
                        strictLocality:
                          description: "Specifies whether a load balancer node should
                            only send traffic to backends in its availability zone,
                            regardless of their health, and ignore backends in other
                            zones. \n If set to `true` and there are no healthy backends
                            in the zone, the node in this zone will respond to incoming
                            traffic with errors. For details about strict locality,
                            see [documentation](/docs/application-load-balancer/concepts/backend-group#locality).
                            \n If `strictLocality` is `true`, the value specified
                            in [locality_aware_routing_percent] is ignored."
                          type: boolean
                      type: object
                    grpc:
                      description: gRPC specific backend settings
                      type: object
                    hc:
                      description: "Health check to perform on targets from target
                        groups. For details about health checking, see [documentation](/docs/application-load-balancer/concepts/backend-group#health-checks).
                        \n If no health checks are specified, active health checking
                        is not performed."
                      properties:
                        grpc:
                          description: GRPC specific health check settings.
                          properties:
                            serviceName:
                              description: "Name of the gRPC service to be checked.
                                \n If not specified, overall health is checked. \n
                                For details about the concept, see [GRPC Health Checking
                                Protocol](https://github.com/grpc/grpc/blob/master/doc/health-checking.md)."
                              type: string
                          type: object
                        healthyThreshold:
                          description: "Number of consecutive successful health checks
                            required to mark an unhealthy target as healthy. \n Both
                            `0` and `1` values amount to one successful check required.
                            \n The value is ignored when a load balancer is initialized;
                            a target is marked healthy after one successful check.
                            \n Default value: `0`."
                          format: int64
                          type: integer
                        http:
                          description: HTTP specific health check settings.
                          properties:
                            expectedStatuses:
                              description: A list of HTTP response statuses considered
                                healthy. By default only 200 HTTP status code considered
                                healthy.
                              items:
                                format: int64
                                type: integer
                              type: array
                            host:
                              description: Value for the HTTP/1.1 `Host` header or
                                the HTTP/2 `:authority` pseudo-header used in requests
                                to targets.
                              type: string
                            path:
                              description: 'HTTP path used in requests to targets:
                                request URI for HTTP/1.1 request line or value for
                                the HTTP/2 `:path` pseudo-header.'
                              type: string
                            useHTTP2:
                              description: "Enables HTTP/2 usage in health checks.
                                \n Default value: `false`, HTTP/1.1 is used."
                              type: boolean
                          type: object
                        interval:
                          description: Base interval between consecutive health checks.
                          format: duration
                          type: string
                        port:
                          description: "Port used for health checks. \n If not specified,
                            the backend port ([HttpBackend.port] or [GrpcBackend.port])
                            is used for health checks."
                          format: int64
                          type: integer
                        stream:
                          description: TCP stream specific health check settings.
                          properties:
                            receive:
                              description: "Data that must be contained in the messages
                                received from targets for a successful health check.
                                \n If not specified, no messages are expected from
                                targets, and those that are received are not checked."
                              type: string
                            send:
                              description: "Message sent to targets during TCP data
                                transfer. \n If not specified, no data is sent to
                                the target."
                              type: string
                          type: object
                        timeout:
                          description: "Health check timeout. \n The timeout is the
                            time allowed for the target to respond to a check. If
                            the target doesn't respond in time, the check is considered
                            failed."
                          format: duration
                          type: string
                        transportSettings:
                          description: Optional transport protocol for health checks.
                            When not set, health checks use the same protocol as the
                            proxied traffic. Use this when health checks' protocol
                            settings differ from their backend, e.g. plaintext health
                            checks for a TLS backend.
                          properties:
                            plaintext:
                              description: Plaintext protocol
                              type: boolean
                            tls:
                              description: TLS settings for health checks.
                              properties:
                                sni:
                                  description: Server Name Indication (SNI) string
                                    for TLS connections.
                                  type: string
                                trustedCA:
                                  description: Validation context for TLS connections.
                                  properties:
                                    bytes:
                                      description: X.509 certificate contents in PEM
                                        format.
                                      type: string
                                    id:
                                      description: Cloud certificate ID.
                                      type: string
                                  type: object
                              type: object
                          type: object
                        unhealthyThreshold:
                          description: "Number of consecutive failed health checks
                            required to mark a healthy target as unhealthy. \n Both
                            `0` and `1` values amount to one unsuccessful check required.
                            \n The value is ignored if a health check is failed due
                            to an HTTP `503 Service Unavailable` response from the
                            target (not applicable to TCP stream health checks). The
                            target is immediately marked unhealthy. \n Default value:
                            `0`."
                          format: int64
                          type: integer
                      type: object
                    http:
                      description: HTTP specific backend settings
                      properties:
                        useHTTP2:
                          description: "Enables HTTP/2 usage in connections between
                            load balancer nodes and backend targets. \n Default value:
                            `false`, HTTP/1.1 is used."
                          type: boolean
                      type: object
                    name:
                      description: Name of the backend.
                      pattern: ^[a-z][-a-z0-9]{1,61}[a-z0-9]$
                      type: string
                    stream:
                      description: TCP stream specific backend settings
                      properties:
                        enableProxy:
                          description: If set, proxy protocol will be enabled for
                            this backend.
                          type: boolean
                        keepConnectionsOnHostHealthFailure:
                          description: If a backend host becomes unhealthy (as determined
                            by the configured health checks), keep connections to
                            the failed host.
                          type: boolean
                      type: object
                    tls:
                      description: "Settings for TLS connections between load balancer
                        nodes and backend targets. \n If specified, the load balancer
                        establishes HTTPS (HTTP over TLS) connections with targets
                        and compares received certificates with the one specified
                        in [BackendTls.validation_context]. If not specified, the
                        load balancer establishes unencrypted HTTP connections with
                        targets."
                      properties:
                        sni:
                          description: Server Name Indication (SNI) string for TLS
                            connections.
                          type: string
                        trustedCA:
                          description: Validation context for TLS connections.
                          properties:
                            bytes:
                              description: X.509 certificate contents in PEM format.
                              type: string
                            id:
                              description: Cloud certificate ID.
                              type: string
                          type: object
                      type: object
                    weight:
                      default: 1
                      description: Weight of the backend.
                      format: int32
                      type: integer
                  required:
                  - backendRef
                  - name
                  type: object
                minItems: 1
                type: array
              sessionAffinity:
                description: "Session affinity configuration for the backend group.
                  \n For details about the concept, see [documentation](/docs/application-load-balancer/concepts/backend-group#session-affinity).
                  \n If session affinity is configured, the backend group should contain
                  exactly one active backend (i.e. with positive [GrpcBackend.backend_weight]),
                  and its [LoadBalancingConfig.load_balancing_mode] should be `MAGLEV_HASH`.
                  If any of these conditions are not met, session affinity will not
                  work."
                properties:
                  connection:
                    description: "Connection-based session affinity configuration.
                      \n For now, a connection is defined only by an IP address of
                      the client."
                    properties:
                      sourceIP:
                        description: Specifies whether an IP address of the client
                          is used to define a connection for session affinity.
                        type: boolean
                    type: object
                  cookie:
                    description: Cookie-based session affinity configuration.
                    properties:
                      name:
                        description: Name of the cookie that is used for session affinity.
                        type: string
                      ttl:
                        description: "Maximum age of cookies that are generated for
                          sessions. \n If set to `0`, session cookies are used, which
                          are stored by clients in temporary memory and are deleted
                          on client restarts. \n If not set, the balancer does not
                          generate cookies and only uses incoming ones for establishing
                          session affinity."
                        format: duration
                        type: string
                    type: object
                  header:
                    description: HTTP-header-field-based session affinity configuration.
                    properties:
                      name:
                        description: Name of the HTTP header field that is used for
                          session affinity.
                        type: string
                    type: object
                type: object
              type:
                description: Type of the backend group.
                enum:
                - HTTP
                - GRPC
                - STREAM
                type: string
            required:
            - backends
            - type
            type: object
          status:
            description: IngressBackendGroupStatus defines the observed state of IngressBackendGroup.
            properties:
              conditions:
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource. --- This struct is intended for direct
                    use as an array at the field path .status.conditions.  For example,
                    \n type FooStatus struct{ // Represents the observations of a
                    foo's current state. // Known .status.conditions.type are: \"Available\",
                    \"Progressing\", and \"Degraded\" // +patchMergeKey=type // +patchStrategy=merge
                    // +listType=map // +listMapKey=type Conditions []metav1.Condition
                    `json:\"conditions,omitempty\" patchStrategy:\"merge\" patchMergeKey:\"type\"
                    protobuf:\"bytes,1,rep,name=conditions\"` \n // other fields }"
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another. This should be when
                        the underlying condition changed.  If that is not known, then
                        using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition. This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon. For instance, if .metadata.generation
                        is currently 12, but the .status.conditions[x].observedGeneration
                        is 9, the condition is out of date with respect to the current
                        state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition. Producers
                        of specific condition types may define expected values and
                        meanings for this field, and whether the values are considered
                        a guaranteed API. The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        --- Many .condition.type values are consistent across resources
                        like Available, but because arbitrary conditions can be useful
                        (see .node.status.conditions), the ability to deconflict is
                        important. The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
